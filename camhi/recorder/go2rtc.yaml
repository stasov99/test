# go2rtc: онлайн-ретрансляция RTSP камеры в WebRTC/HLS/RTSP для многих клиентов.
# Камера отдаёт один поток, go2rtc раздаёт его сколько угодно зрителям.
# Запуск: ./go2rtc  (возьмёт этот конфиг из текущей папки)
# UI и плеер: http://<host>:1984/

streams:
  # high — основной поток (максимальное качество, для записи и просмотра)
  cam1_high:
    - rtsp://admin:password@192.168.1.50:554/11
  # low — субпоток (для превью/мобильных)
  cam1_low:
    - rtsp://admin:password@192.168.1.50:554/12

api:
  listen: ":1984"

rtsp:
  listen: ":8554"   # go2rtc сам отдаёт RTSP: rtsp://<host>:8554/cam1_high

webrtc:
  listen: ":8555"
